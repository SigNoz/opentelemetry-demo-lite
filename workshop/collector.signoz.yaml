# Use only after choosing a dedicated self-hosted test SigNoz collector.
# Example Docker Desktop endpoint: host.docker.internal:4317.
# No credentials are needed or configured by this file.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  resource:
    attributes:
      - key: deployment.environment
        value: workshop
        action: upsert
  batch:
    timeout: 1s
exporters:
  otlp:
    endpoint: ${env:WORKSHOP_OTLP_ENDPOINT}
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp]
